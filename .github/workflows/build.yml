name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi" "-DCMAKE_MODULE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF" "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF"

      - name: Build
        run: cmake --build build --config Release --target Flyby_VST3 --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Flyby-VST3-Windows
          path: build/Flyby_artefacts/Release/VST3/Flyby.vst3

      - name: Get pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          $exe = Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          & $exe.FullName --version
          & $exe.FullName --strictness-level 10 --timeout-ms 600000 --sample-rates 44100,48000,96000 --block-sizes 32,64,256,512,1024 --validate "build/Flyby_artefacts/Release/VST3/Flyby.vst3"
          Write-Host "pluginval exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Crash report (only runs if pluginval failed)
        if: failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $pdbDirs = (Get-ChildItem build -Recurse -Filter *.pdb | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique) -join ";"
          Write-Host "cdb: $($cdb.FullName)  pdb dirs: $pdbDirs"
          & $cdb.FullName -g -G -y "$pdbDirs" -c ".lines -e; .ecxr; kpn 60; ~*kn 25; q" $exe.FullName --strictness-level 10 --validate-in-process --timeout-ms 600000 --sample-rates 44100 --block-sizes 512 --validate "build/Flyby_artefacts/Release/VST3/Flyby.vst3"
          exit 1
